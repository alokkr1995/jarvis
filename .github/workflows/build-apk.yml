name: Build Jarvis APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: jarvis-build
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Restore signing key from secret
        env:
          JARVIS_KEYSTORE: ${{ secrets.JARVIS_KEYSTORE }}
        run: |
          if [ -z "$JARVIS_KEYSTORE" ]; then
            echo "::error::Add the JARVIS_KEYSTORE secret (repo Settings > Secrets and variables > Actions)"
            exit 1
          fi
          echo "$JARVIS_KEYSTORE" | base64 -d > app/jarvis.keystore

      - name: Download offline wake-word engine + "Jarvis" model (sherpa-onnx, Apache-2.0)
        run: |
          set -e
          mkdir -p app/libs app/src/main/assets/kws
          rel=https://github.com/k2-fsa/sherpa-onnx/releases/download
          curl -fsSL -o app/libs/sherpa-onnx.aar $rel/v2.0.3/sherpa-onnx-2.0.3.aar
          curl -fsSL -o /tmp/kws.tar.bz2 $rel/kws-models/sherpa-onnx-kws-zipformer-gigaspeech-3.3M-2024-01-01.tar.bz2
          tar xjf /tmp/kws.tar.bz2 -C /tmp
          m=/tmp/sherpa-onnx-kws-zipformer-gigaspeech-3.3M-2024-01-01
          cp $m/encoder-epoch-12-avg-2-chunk-16-left-64.int8.onnx app/src/main/assets/kws/encoder.onnx
          cp $m/decoder-epoch-12-avg-2-chunk-16-left-64.int8.onnx app/src/main/assets/kws/decoder.onnx
          cp $m/joiner-epoch-12-avg-2-chunk-16-left-64.int8.onnx app/src/main/assets/kws/joiner.onnx
          cp $m/tokens.txt app/src/main/assets/kws/tokens.txt
          printf '\xe2\x96\x81JA R VI S @JARVIS\n' > app/src/main/assets/kws/keywords.txt
          cat app/src/main/assets/kws/keywords.txt
          ls -la app/libs app/src/main/assets/kws

      - name: Build APK
        run: gradle assembleRelease --stacktrace

      - name: Rename APK
        run: cp app/build/outputs/apk/release/app-release.apk Jarvis.apk

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Jarvis build ${{ github.run_number }}
          files: Jarvis.apk
          make_latest: "true"
