name: Build Jarvis APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: jarvis-build
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Restore signing key from secret
        env:
          JARVIS_KEYSTORE: ${{ secrets.JARVIS_KEYSTORE }}
        run: |
          if [ -z "$JARVIS_KEYSTORE" ]; then
            echo "::error::Add the JARVIS_KEYSTORE secret (repo Settings > Secrets and variables > Actions)"
            exit 1
          fi
          echo "$JARVIS_KEYSTORE" | base64 -d > app/jarvis.keystore

      - name: Download free wake-word models (openWakeWord)
        run: |
          mkdir -p app/src/main/assets
          base=https://github.com/dscripka/openWakeWord/releases/download/v0.5.1
          curl -fsSL -o app/src/main/assets/melspectrogram.onnx $base/melspectrogram.onnx
          curl -fsSL -o app/src/main/assets/embedding_model.onnx $base/embedding_model.onnx
          curl -fsSL -o app/src/main/assets/hey_jarvis.onnx $base/hey_jarvis_v0.1.onnx
          ls -la app/src/main/assets

      - name: Build APK
        run: gradle assembleDebug --stacktrace

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk Jarvis.apk

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Jarvis build ${{ github.run_number }}
          files: Jarvis.apk
          make_latest: "true"
